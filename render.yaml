services:
  # Backend Django API
  - type: web
    name: smartstay-backend
    env: python
    rootDir: .
    buildCommand: "./build.sh"
    startCommand: "gunicorn smartstay.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # Frontend Next.js App
  - type: web
    name: smartstay-frontend
    env: node
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://smartstay-backend.onrender.com/api"
      - key: NODE_VERSION
        value: 22.5.1
