services:
  # Backend Django API
  - type: web
    name: smartstay-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn smartstay.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartstay-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # PostgreSQL Database
  - type: pserv
    name: smartstay-db
    env: docker
    plan: free
    ipAllowList: []
